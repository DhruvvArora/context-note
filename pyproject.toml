[project]
name = "context-note"
version = "0.1.0"
description = "Local, cross-project search over your Claude conversation history, exposed to Claude Desktop via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
context-note = "context_note.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_note"]

[tool.pytest.ini_options]
testpaths = ["tests"]
