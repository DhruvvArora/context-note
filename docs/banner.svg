<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="50" y="20" width="1000" height="260" rx="12" fill="#1e1e2a" stroke="#33333f" stroke-width="1"/>

    <!-- title bar -->
    <rect x="50" y="20" width="1000" height="36" rx="12" fill="#26262f"/>
    <rect x="50" y="44" width="1000" height="12" fill="#26262f"/>
    <circle cx="76" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="96" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="116" cy="38" r="6" fill="#27c93f"/>
    <text x="550" y="43" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8a8a99">zsh — context-note</text>

    <!-- body -->
    <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="80" y="100" fill="#7ee787">$</text>
      <text x="98" y="100" fill="#e6e6e6">context-note search "chunking strategy"</text>

      <text x="80" y="140" fill="#6ab0f3">[(no project)]</text>
      <text x="228" y="140" fill="#e6e6e6">Building the ingest pipeline</text>
      <text x="560" y="140" fill="#8a8a99">2026-06-12</text>
      <text x="670" y="140" fill="#8a8a99">(assistant)</text>
      <text x="98" y="164" fill="#9d9daa">Went with paragraph-boundary chunking, capped at 1200 chars…</text>

      <text x="80" y="204" fill="#6ab0f3">[(no project)]</text>
      <text x="228" y="204" fill="#e6e6e6">API redesign notes</text>
      <text x="470" y="204" fill="#8a8a99">2026-04-03</text>
      <text x="580" y="204" fill="#8a8a99">(human)</text>
      <text x="98" y="228" fill="#9d9daa">should we reuse the same chunking approach we used for…</text>

      <text x="80" y="262" fill="#7ee787">$</text>
      <rect x="98" y="249" width="10" height="18" fill="#e6e6e6">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
